services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://archive:archive@db:5432/archive
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://archive:archive@db:5432/archive
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
    volumes:
      - ./storage:/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
